name: Build G3MStudio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest, rid: win-x64, suffix: Windows-x64, extension: .exe }
          - { name: Windows arm64, runner: windows-11-arm, rid: win-arm64, suffix: Windows-arm64, extension: .exe }
          - { name: Linux x64, runner: ubuntu-latest, rid: linux-x64, suffix: Linux-x64, extension: "" }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, rid: linux-arm64, suffix: Linux-arm64, extension: "" }
          - { name: macOS x64, runner: macos-26-intel, rid: osx-x64, suffix: macOS-x64, extension: "" }
          - { name: macOS arm64, runner: macos-26, rid: osx-arm64, suffix: macOS-arm64, extension: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test G3MStudio.slnx --configuration Release

      - name: Publish
        run: dotnet publish G3MStudio/G3MStudio.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish/${{ matrix.rid }}

      - name: Bundle
        id: bundle
        shell: pwsh
        run: |
          $versionOutput = @(dotnet msbuild G3MStudio/G3MStudio.csproj -getProperty:Version -nologo -verbosity:quiet)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($versionOutput | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not determine the version.' }

          $publishDirectory = "publish/${{ matrix.rid }}"
          $executableName = "G3MStudio${{ matrix.extension }}"
          $executable = Join-Path $publishDirectory $executableName
          if (-not (Test-Path -LiteralPath $executable)) { throw "Published executable not found: $executable" }

          $archivePath = "G3MStudio-${{ matrix.suffix }}-$version.zip"
          $bundleDirectory = 'bundle'
          New-Item -ItemType Directory -Path $bundleDirectory | Out-Null

          # Everything sits in the zip root. macOS ships the app bundle at the root (questions Q38, Q51).
          if ('${{ matrix.rid }}' -like 'osx-*') {
            $macOsDirectory = Join-Path $bundleDirectory 'G3MStudio.app/Contents/MacOS'
            New-Item -ItemType Directory -Force -Path $macOsDirectory | Out-Null
            Copy-Item -LiteralPath $executable -Destination $macOsDirectory
            & chmod +x (Join-Path $macOsDirectory 'G3MStudio')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>G3MStudio</string>
            <key>CFBundleIdentifier</key>
            <string>space.y114.g3mstudio</string>
            <key>CFBundleName</key>
            <string>G3MStudio</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleVersion</key>
            <string>$version</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          "@ | Set-Content -LiteralPath (Join-Path $bundleDirectory 'G3MStudio.app/Contents/Info.plist') -Encoding utf8NoBOM
            $required = 'G3MStudio.app/Contents/MacOS/G3MStudio', 'G3MStudio.app/Contents/Info.plist'
          } else {
            Copy-Item -LiteralPath $executable -Destination $bundleDirectory
            if (-not $IsWindows) {
              & chmod +x (Join-Path $bundleDirectory $executableName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $required = @($executableName)
          }
          Copy-Item -LiteralPath LICENSE -Destination $bundleDirectory
          $required += 'LICENSE'

          if ($IsWindows) {
            Compress-Archive -Path "$bundleDirectory/*" -DestinationPath $archivePath
          } else {
            Push-Location $bundleDirectory
            & zip -q -r -y "../$archivePath" .
            $zipExitCode = $LASTEXITCODE
            Pop-Location
            if ($zipExitCode -ne 0) { exit $zipExitCode }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entryNames = $archive.Entries.FullName
            foreach ($file in $required) {
              if ($file -notin $entryNames) { throw "Archive is missing $file" }
            }
          } finally {
            $archive.Dispose()
          }

          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Smoke
        shell: pwsh
        run: |
          # Start the app from the zip: it opens the window, waits 2 s and exits 0 (--smoke).
          $archive = (Resolve-Path '${{ steps.bundle.outputs.archive }}').Path
          $directory = Join-Path $PWD 'smoke'
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $directory
          } else {
            & unzip -q $archive -d $directory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $program = if ('${{ matrix.rid }}' -like 'osx-*') { Join-Path $directory 'G3MStudio.app/Contents/MacOS/G3MStudio' } else { Join-Path $directory "G3MStudio${{ matrix.extension }}" }
          $file = $program
          $arguments = @('--smoke')
          if ($IsLinux) {
            if (-not (Get-Command xvfb-run -ErrorAction SilentlyContinue)) {
              sudo apt-get update
              sudo apt-get install -y xvfb
            }
            $file = 'xvfb-run'
            $arguments = @('-a', $program, '--smoke')
          }

          $errorFile = Join-Path $PWD 'smoke-error.txt'
          $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru -RedirectStandardError $errorFile
          if (-not $process.WaitForExit(90000)) {
            $process.Kill($true)
            throw 'The app did not exit within 90 s.'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content -LiteralPath $errorFile -ErrorAction SilentlyContinue
            throw "The app exited with code $($process.ExitCode)."
          }

      - uses: actions/upload-artifact@v7
        with:
          name: G3MStudio-${{ matrix.suffix }}
          path: ${{ steps.bundle.outputs.archive }}
          if-no-files-found: error
